# Server template. Export graphs with adjacency, features, labels and three
# disjoint node-index arrays; see docs/LATENT_CONSTRUCTION_THEORY.md and README.
project:
  protocol: latent_b1_npz_pilot_v1
  mode: npz
  seed: 20261115

npz:
  files:
    - ../data/processed/cora_b1.npz

kernel:
  kind: norm_laplacian
  lam: 0.0
  times: [0.75, 1.5, 3.0]
  weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
  dense_limit: 128

sparse:
  landmarks: 128
  top_k: 16
  batch_size: 16

hard:
  enabled: false

evaluation:
  C_grid: [0.1, 1.0, 10.0]
