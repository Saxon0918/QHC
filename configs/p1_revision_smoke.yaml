# Small synthetic engineering run. It is not a Gate A or Gate B result.
project:
  name: quantum_hypergraph
  protocol: synthetic_p1_revision_smoke_v1
  mode: synthetic
  seed: 42

synthetic:
  cases: [S1, S2]
  graph:
    n_nodes: 16
    num_hyperedges: 12
    edge_sizes: [3, 4]
    n_blocks: 4
  split_seeds:
    train: [11, 12, 13]
    validation: [21]
    test: [31, 32]

candidate:
  budgets: [20, 40, 80]
  analysis_budget: 80
  target_exact_f1: 0.5
  min_size: 2
  max_size: 4
  beam_width: 32
  max_visited: 5000
  search_exploration_fraction: 0.2
  quota_exploration_fraction: 0.2

time:
  points: [0.25, 1.0]

spectral:
  eps: 0.000001
  dense_limit: 100

scorer:
  model: logistic_regression
  C_grid: [0.1, 1.0]
  class_weight: null

selection:
  max_selected_grid: [5, 10, 20]
