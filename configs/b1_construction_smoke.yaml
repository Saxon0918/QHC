# Precommitted CPU engineering/negative-control experiment, not a publication gate.
project:
  protocol: latent_b1_synthetic_smoke_v1
  mode: synthetic
  seed: 20261115

synthetic:
  regimes: [group, pairwise, heterophily]
  graph_seeds: [11, 23, 37]
  n_nodes: 48

kernel:
  kind: norm_laplacian
  lam: 0.0
  times: [0.75, 1.5, 3.0]
  weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
  dense_limit: 128

sparse:
  landmarks: 24
  top_k: 5
  batch_size: 12

hard:
  enabled: true
  min_size: 2
  max_size: 4
  neighborhood_cap: 8
  max_candidates: 90
  budget: 10
  weight_grid: [0.25, 0.5, 1.0, 2.0]

evaluation:
  C_grid: [0.1, 1.0, 10.0]
